name: release-candidate
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: make BUILD=build-static STATIC=1 check
      - run: BUILD=build-static sh scripts/validate.sh release-candidate
      - run: sh scripts/package.sh build-static/cincta
      # Produces reviewable artifacts. Publishing a stable release is a separate
      # maintainer action after the documented VM/Docker/strict security gates.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-${{ matrix.runner }}
          path: |
            dist/*
            reports/v02-release-candidate/
